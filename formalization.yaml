# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

project:
  name: "kahn-kalai"
  description: >-
    Lean 4 / Mathlib formalization of the Park–Pham theorem (Kahn–Kalai
    expectation threshold) following Tran–Vu’s one-page inductive covering
    argument: for an ℓ-bounded family F of subsets of a finite ground set,
    p_c(F) = O(q(F) log ℓ). The compared statements are Tran–Vu’s strengthened
    covering theorem (EJC 31(3) #P3.2 (2024), Theorem 2.3, constant L = 1000)
    and the Park–Pham / Kahn–Kalai bound (their Theorem 1.1).
  authors:
    - "Dan Clemens Posch"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Dan Clemens Posch"

classification:
  arxiv: ["math.CO", "math.PR"]
  msc2020: ["05C80", "60C05"]

sources:
  - title: "A Short Proof of Kahn-Kalai Conjecture"
    authors:
      - "Phuc Tran"
      - "Van Vu"
    id: "doi:10.37236/12266"
    type: "article"
    location: "Electron. J. Combin. 31 (2024), no. 3, #P3.2; arXiv:2303.02144"
    relationship: "independently-proves"
    note: >-
      The formalization follows Tran–Vu’s inductive covering argument
      (Theorems 2.3 and 1.1). Challenge uses their L = 1000 covering
      constant and base-2 logarithm. The constant-reduction L ≈ 3.998
      and the ε-covering theorems of §§3–4 are not compared.
    license: "CC-BY-ND-4.0"
    author_endorsement: "not-contacted"
  - title: "A Proof of the Kahn-Kalai Conjecture"
    authors:
      - "Jinyoung Park"
      - "Huy Tuan Pham"
    id: "arXiv:2203.17207"
    type: "article"
    location: "arXiv:2203.17207; J. Amer. Math. Soc. 37 (2024)"
    relationship: "background"
    note: >-
      Original proof of the conjecture. Tran–Vu replace Park–Pham’s analysis
      by induction; the remaining coupling of product measure with a uniform
      level (Remark 2.5) is the same ingredient.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Thresholds versus expectation-thresholds"
    authors:
      - "Jeff Kahn"
      - "Gil Kalai"
    type: "article"
    location: "preprint; the expectation-threshold conjecture"
    relationship: "background"
    note: "The conjecture settled by Park–Pham."
    license: "unknown"
    author_endorsement: "n/a"

related_formalizations: []

status:
  scope: >-
    Compared: Tran–Vu Theorem 2.3 (covering_theorem, L = 1000, log base 2)
    and Theorem 1.1 (park_pham, existential K). Not compared: the
    L ≈ 3.998 optimisation, Bell’s ε-covering theorem, and §§3–4.
    Ground sets are finite types; families are Finsets of Finsets.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

automation:
  methods:
    - method: "agent"
      models: ["grok-4.6"]
      framework: "Grok Build TUI"
      tool_setup: "AI-assisted Lean 4 with Mathlib v4.32.0; local lake verify"
      cost:
        wall_time: "in progress"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "Tran–Vu one-page induction, Palomar Challenge/Solution split"
  spend_usd: "not tracked"
  notes: >-
    Coordinator scaffolded the Palomar project; proof lanes fill
    covering_theorem then park_pham. Scratch files are verified with
    scripts/lean_verify.sh --file FILE --receipt-only, patterned on
    jc2-lean/max11-partial-y/scripts/box_lean_verify.sh.

fidelity:
  divergences: >-
    Logarithm is Real.logb 2 (Tran–Vu’s base-2 convention). Thresholds
    are sInf/sSup rather than “the unique p with equality 1/2”.
    covering_theorem fixes L = 1000 rather than “sufficiently large L”.
    park_pham uses Type (universe 0) rather than Type*.

review:
  status: "self-assessed; in progress"
  reviewers:
    - "none"
  notes: "Statement surface follows Tran–Vu Theorems 1.1 and 2.3."

alignment:
  namespace: "KahnKalai"
  statements:
    - source: "Tran–Vu, Theorem 2.3"
      lean: "KahnKalai.covering_theorem"
      module: "Challenge"
      status: "proved"
      note: "Strengthened covering theorem with L = 1000."
    - source: "Tran–Vu, Theorem 1.1 / Park–Pham"
      lean: "KahnKalai.park_pham"
      module: "Challenge"
      status: "proved"
      note: "Existential K form of p_c ≤ K q log ℓ, with K = 100000."

acknowledgements: >-
  Mathlib; Tran–Vu EJC 2024; Park–Pham JAMS 2024; Palomar template;
  jc2-lean box_lean/scratch/lane machinery (local receipt gate only).
